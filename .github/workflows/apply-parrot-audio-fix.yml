name: Apply parrot AMBE channel-coding fix

on:
  push:
    branches:
      - fix/parrot-voice-channel-coding
    paths:
      - scripts/apply_parrot_audio_channel_fix.py
      - scripts/repair_parrot_voice_assets.py
      - tests/test_parrot_voice.py
      - .github/workflows/apply-parrot-audio-fix.yml

permissions:
  contents: write

jobs:
  apply-and-validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/parrot-voice-channel-coding
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dashboard.txt

      - name: Install HBlink4 test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r requirements-dashboard.txt

      - name: Apply source and regression patches
        run: python scripts/apply_parrot_audio_channel_fix.py

      - name: Losslessly repair bundled AMBE vocabulary
        run: python scripts/repair_parrot_voice_assets.py

      - name: Compile and run full regression
        run: |
          python -m compileall -q hblink4 dashboard scripts
          python -m pytest tests/ -v

      - name: Commit clean feature changes
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/apply-parrot-audio-fix.yml scripts/apply_parrot_audio_channel_fix.py
          git add hblink4/parrot_ambe.py \
                  hblink4/parrot_voice.py \
                  hblink4/parrot_voice_assets.py \
                  hblink4/parrot_voice_assets.tar.gz \
                  scripts/generate_parrot_voice_assets.py \
                  scripts/repair_parrot_voice_assets.py \
                  tests/test_parrot_voice.py \
                  tests/test_parrot_voice_assets.py \
                  docs/parrot_voice_telemetry.md
          git diff --cached --check
          git commit -m 'Fix parrot AMBE channel coding and DMR conversion'
          git push origin HEAD:fix/parrot-voice-channel-coding
