name: Apply parrot feature patch

on:
  push:
    branches:
      - feature/parrot-voice-telemetry-timeout-fix
    paths:
      - .github/workflows/apply-parrot-feature.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/parrot-voice-telemetry-timeout-fix

      - name: Apply parrot runtime integration
        run: python scripts/apply_parrot_feature_patch.py

      - name: Commit integration
        run: |
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add hblink4/parrot.py
          git commit -m "Fix parrot slot cleanup and add voice telemetry runtime"
          git push
