name: Apply parrot feature patch

on:
  push:
    branches:
      - feature/parrot-voice-telemetry-timeout-fix
    paths:
      - .github/workflows/apply-parrot-feature.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/parrot-voice-telemetry-timeout-fix

      - name: Apply dashboard integration
        run: python scripts/apply_parrot_dashboard_patch.py

      - name: Commit integration
        run: |
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dashboard/parrot_activity_state.py dashboard/static/parrot_activity_poll.js dashboard/static/local_services.js tests/test_parrot_activity_recovery.py tests/test_parrot_activity_dashboard.py
          git commit -m "Show parrot voice report and reset final activity"
          git push
