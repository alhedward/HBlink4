name: Apply parrot feature patch

on:
  push:
    branches:
      - feature/parrot-voice-telemetry-timeout-fix
    paths:
      - .github/workflows/apply-parrot-feature.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/parrot-voice-telemetry-timeout-fix

      - name: Apply config and logging integration
        run: python scripts/apply_parrot_config_patch.py

      - name: Commit integration
        run: |
          git diff --check
          python -m json.tool config/config_sample.json >/dev/null
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add hblink4/parrot.py config/config_sample.json
          git commit -m "Document voice telemetry and surface parrot logs"
          git push
