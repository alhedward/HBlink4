name: Apply parrot LC fix

on:
  push:
    branches:
      - feature/parrot-voice-telemetry-timeout-fix
    paths:
      - .github/workflows/apply-parrot-feature.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/parrot-voice-telemetry-timeout-fix

      - name: Align generated group-voice LC
        run: python scripts/fix_parrot_voice_lc.py

      - name: Commit LC fix
        run: |
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add hblink4/parrot_voice.py
          git commit -m "Use canonical group voice LC for parrot telemetry"
          git push
