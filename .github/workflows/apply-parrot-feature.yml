name: Validate parrot feature branch

on:
  push:
    branches:
      - feature/parrot-voice-telemetry-timeout-fix
    paths:
      - .github/workflows/apply-parrot-feature.yml

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/parrot-voice-telemetry-timeout-fix

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dashboard.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r requirements-dashboard.txt

      - name: Validate syntax and sample configuration
        run: |
          python -m compileall -q hblink4 dashboard tests
          python -m json.tool config/config_sample.json >/dev/null
          git diff --check

      - name: Run full regression suite
        run: python -m pytest tests/ -v
