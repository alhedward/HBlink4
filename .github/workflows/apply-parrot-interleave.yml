name: Apply parrot AMBE interleave fix

on:
  push:
    branches:
      - feature/parrot-voice-telemetry-timeout-fix
    paths:
      - .github/workflows/apply-parrot-interleave.yml

permissions:
  contents: write

jobs:
  patch-and-test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/parrot-voice-telemetry-timeout-fix

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Apply AMBE interleave patch
        run: python scripts/apply_parrot_ambe_interleave.py

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r requirements-dashboard.txt

      - name: Run full HBlink4 regression
        run: |
          git diff --check
          python -m pytest tests/ -v

      - name: Remove one-shot patch machinery
        run: |
          rm -f scripts/apply_parrot_ambe_interleave.py
          rm -f .github/workflows/apply-parrot-interleave.yml

      - name: Commit interleave fix
        run: |
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Interleave parrot AMBE frames for DMR voice bursts"
          git push
