name: Apply parrot admin toggle

on:
  push:
    branches:
      - feature/parrot-voice-admin-toggle
    paths:
      - .github/workflows/apply-parrot-admin-toggle.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/parrot-voice-admin-toggle
          fetch-depth: 0
      - name: Patch composed admin application
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('dashboard/admin_app.py')
          text = path.read_text(encoding='utf-8')

          text = text.replace(
              'from .admin_identity import CognitoAdminIdentityService\nfrom .cognito_auth import CognitoAuthError, CognitoPasswordError\n',
              'from .admin_identity import CognitoAdminIdentityService\n'
              'from .admin import StaleConfigError, TalkgroupConfigError\n'
              'from .cognito_auth import CognitoAuthError, CognitoChallengeError, CognitoPasswordError\n'
              'from .parrot_admin import ParrotVoiceTelemetryStore\n',
          )
          text = text.replace('_DASHBOARD_VERSION = "1.3.0"', '_DASHBOARD_VERSION = "1.3.3"')
          text = text.replace('_ADMIN_ASSET_VERSION = "20260830-parrot-live-2"', '_ADMIN_ASSET_VERSION = "20260830-parrot-admin-1"')

          old_scripts = """            f'\\n<script src=\"/static/admin_profile_compact.js?v={version}\"></script>'\n            f'\\n<script src=\"/static/local_services.js?v={version}\"></script>\\n'\n"""
          new_scripts = """            f'\\n<script src=\"/static/admin_profile_compact.js?v={version}\"></script>'\n            f'\\n<script src=\"/static/admin_parrot.js?v={version}\"></script>'\n            f'\\n<script src=\"/static/local_services.js?v={version}\"></script>\\n'\n"""
          if old_scripts not in text:
              raise SystemExit('admin script injection anchor not found')
          text = text.replace(old_scripts, new_scripts, 1)

          old_service = '''                    "scope": "local-only",\n                    "description": (\n'''
          new_service = '''                    "scope": "local-only",\n                    "voice_telemetry_enabled": parrot.get("voice_telemetry_enabled") is True,\n                    "description": (\n'''
          if old_service not in text:
              raise SystemExit('public local service anchor not found')
          text = text.replace(old_service, new_service, 1)

          anchor = '''    async def _profile(self, scope, receive, send, update=False):\n'''
          method = '''    async def _parrot_voice_telemetry(self, scope, receive, send, update=False):\n        session = auth_app._session_from_scope(scope)\n        if session is None:\n            await self._send(JSONResponse({"detail": "Administrator login required"}, status_code=401), scope, receive, send)\n            return\n\n        store = ParrotVoiceTelemetryStore(server._talkgroup_store())\n        try:\n            if update:\n                try:\n                    auth_app._require_csrf_scope(scope, session)\n                except CognitoChallengeError as exc:\n                    await self._send(JSONResponse({"detail": str(exc)}, status_code=403), scope, receive, send)\n                    return\n                if not session.config_backup_confirmed:\n                    await self._send(\n                        JSONResponse(\n                            {"detail": "Download the current HBlink4 config backup before changing voice telemetry"},\n                            status_code=428,\n                        ),\n                        scope, receive, send,\n                    )\n                    return\n                payload = await auth_app._read_json(receive)\n                if not isinstance(payload, dict):\n                    await self._send(JSONResponse({"detail": "Request body must be a JSON object"}, status_code=400), scope, receive, send)\n                    return\n                saved = await asyncio.to_thread(\n                    store.save,\n                    expected_revision=payload.get("revision"),\n                    enabled=payload.get("enabled"),\n                )\n                response = JSONResponse({"ok": True, "restart_required": True, "configuration": saved})\n                server.logger.warning(\n                    "Dashboard admin %s set parrot voice telemetry to %s",\n                    session.username,\n                    saved["voice_telemetry_enabled"],\n                )\n            else:\n                response = JSONResponse(await asyncio.to_thread(store.load))\n        except StaleConfigError as exc:\n            response = JSONResponse({"detail": str(exc)}, status_code=409)\n        except TalkgroupConfigError as exc:\n            response = JSONResponse({"detail": str(exc)}, status_code=400 if update else 500)\n        await self._send(response, scope, receive, send)\n\n'''
          if anchor not in text:
              raise SystemExit('admin method anchor not found')
          text = text.replace(anchor, method + anchor, 1)

          route_anchor = '''        if method == "GET" and path == "/api/local-services":\n            await self._send(JSONResponse({"services": _public_local_services()}), scope, receive, send)\n            return\n\n'''
          route = route_anchor + '''        if path == "/api/admin/local-services/parrot/voice-telemetry":\n            if method == "GET":\n                await self._parrot_voice_telemetry(scope, receive, send, update=False)\n                return\n            if method == "PUT":\n                await self._parrot_voice_telemetry(scope, receive, send, update=True)\n                return\n\n'''
          if route_anchor not in text:
              raise SystemExit('route anchor not found')
          text = text.replace(route_anchor, route, 1)

          path.write_text(text, encoding='utf-8')
          PY

          rm -f .github/workflows/apply-parrot-admin-toggle.yml
          python3 -m py_compile dashboard/admin_app.py dashboard/parrot_admin.py
          git diff --check
      - name: Commit patch and remove one-shot workflow
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add dashboard/admin_app.py .github/workflows/apply-parrot-admin-toggle.yml
          git commit -m 'Add protected parrot voice telemetry admin route'
          git push origin HEAD:feature/parrot-voice-admin-toggle
