name: Apply Cognito admin integration fix

on:
  push:
    branches:
      - feature/cognito-admins
    paths:
      - .github/workflows/apply-cognito-admins-fix.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/cognito-admins
          fetch-depth: 0

      - name: Recover and apply generated patch
        shell: bash
        run: |
          sed -n '26p' .github/workflows/apply-cognito-admins.yml > /tmp/patch.py.gz.b64
          base64 -d /tmp/patch.py.gz.b64 | gzip -d > /tmp/patch.py
          python /tmp/patch.py

      - name: Add semantic dashboard version
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          server = Path('dashboard/server.py')
          text = server.read_text()
          text = text.replace('app = FastAPI(title="HBlink4 Dashboard", version="1.1.0")', 'DASHBOARD_VERSION = "1.2.0"\napp = FastAPI(title="HBlink4 Dashboard", version=DASHBOARD_VERSION)')
          text = text.replace('    public_config["admin_available"] = admin_available()\n', '    public_config["admin_available"] = admin_available()\n    public_config["dashboard_version"] = DASHBOARD_VERSION\n')
          text = text.replace('        "restart_enabled": bool(restart_cfg.get("enabled", False)),\n', '        "restart_enabled": bool(restart_cfg.get("enabled", False)),\n        "dashboard_version": DASHBOARD_VERSION,\n')
          server.write_text(text)

          admin_html = Path('dashboard/static/admin.html')
          text = admin_html.read_text()
          text = text.replace('<div class="subtle">Repeater talkgroup access control</div>', '<div class="subtle">Repeater talkgroup access control · Dashboard <span id="dashboardVersion">v1.2.0</span></div>')
          text = text.replace("        state.restartEnabled = status.restart_enabled;\n", "        state.restartEnabled = status.restart_enabled;\n        if (status.dashboard_version) $('dashboardVersion').textContent = `v${status.dashboard_version}`;\n")
          admin_html.write_text(text)

          dashboard_html = Path('dashboard/static/dashboard.html')
          text = dashboard_html.read_text()
          if 'id="dashboardVersion"' not in text:
              marker = '<div class="server-description" id="serverDescription"></div>'
              if marker in text:
                  text = text.replace(marker, marker + '\n                <div class="server-description">Dashboard <span id="dashboardVersion">v1.2.0</span></div>')
              config_assignment = "document.getElementById('serverDescription').textContent = config.server_description || '';"
              if config_assignment in text:
                  text = text.replace(config_assignment, config_assignment + "\n            const versionEl = document.getElementById('dashboardVersion');\n            if (versionEl && config.dashboard_version) versionEl.textContent = `v${config.dashboard_version}`;")
          dashboard_html.write_text(text)
          PY

      - name: Validate and run regression suite
        shell: bash
        run: |
          python -m py_compile dashboard/cognito_auth.py dashboard/server.py
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r requirements-dashboard.txt
          python -m pytest tests/ -v

      - name: Commit generated integration
        shell: bash
        run: |
          rm .github/workflows/apply-cognito-admins.yml .github/workflows/apply-cognito-admins-fix.yml
          git config user.name "HBlink4 automation"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "Add Cognito-backed multi-admin dashboard"
          git push origin HEAD:feature/cognito-admins
