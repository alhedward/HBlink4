name: Apply known-good restart promotion

on:
  push:
    branches:
      - feature/parrot-voice-admin-toggle
    paths:
      - .github/workflows/apply-known-good-restart.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/parrot-voice-admin-toggle
          fetch-depth: 0
      - name: Promote config only after verified restart
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('dashboard/server.py')
          text = path.read_text(encoding='utf-8')
          old = '''    logger.info("Dashboard admin %s restarted HBlink4 successfully", session.username)\n    return result\n'''
          new = '''    logger.info("Dashboard admin %s restarted HBlink4 successfully", session.username)\n\n    # A downloaded backup protects against accidental overwrite, but it does not\n    # prove the configuration is healthy. Promote the exact current bytes to a\n    # separate last-known-good snapshot only after the fixed restart controller\n    # has verified that hblink4.service returned active.\n    try:\n        known_good = _talkgroup_store().mark_current_known_good()\n    except TalkgroupConfigError as exc:\n        logger.error(\n            "HBlink4 restarted successfully but last-known-good snapshot failed: %s", exc\n        )\n        result["known_good_recorded"] = False\n    else:\n        result["known_good_recorded"] = True\n        result["known_good_revision"] = known_good["revision"]\n    return result\n'''
          if old not in text:
              raise SystemExit('restart return anchor not found')
          text = text.replace(old, new, 1)
          path.write_text(text, encoding='utf-8')
          PY

          rm -f .github/workflows/apply-known-good-restart.yml
          python3 -m py_compile dashboard/server.py
          git diff --check
      - name: Commit restart safety change
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add dashboard/server.py .github/workflows/apply-known-good-restart.yml
          git commit -m 'Promote config to known-good only after verified restart'
          git push origin HEAD:feature/parrot-voice-admin-toggle
