name: Apply Cognito admin integration

on:
  push:
    branches:
      - feature/cognito-admins
    paths:
      - .github/workflows/apply-cognito-admins.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/cognito-admins
          fetch-depth: 0

      - name: Apply Cognito admin integration
        shell: bash
        run: |
          cat > /tmp/patch.py.gz.b64 <<'B64'

B64
          base64 -d /tmp/patch.py.gz.b64 | gzip -d > /tmp/patch.py
          python /tmp/patch.py

      - name: Validate and run regression suite
        shell: bash
        run: |
          python -m py_compile dashboard/cognito_auth.py dashboard/server.py
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r requirements-dashboard.txt
          python -m pytest tests/ -v

      - name: Commit generated integration
        shell: bash
        run: |
          rm .github/workflows/apply-cognito-admins.yml
          git config user.name "HBlink4 automation"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "Add Cognito-backed multi-admin dashboard"
          git push origin HEAD:feature/cognito-admins
