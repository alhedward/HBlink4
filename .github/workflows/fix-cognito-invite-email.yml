name: Fix Cognito invite email verification

on:
  push:
    branches:
      - fix/cognito-invite-email-verification
    paths:
      - .github/workflows/fix-cognito-invite-email.yml

permissions:
  contents: write

jobs:
  patch-and-test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/cognito-invite-email-verification
          fetch-depth: 0

      - name: Mark invited admin email verified
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('dashboard/cognito_auth.py')
          text = path.read_text(encoding='utf-8')
          old = 'UserAttributes=[{"Name": "email", "Value": email}],'
          new = '''UserAttributes=[
                      {"Name": "email", "Value": email},
                      {"Name": "email_verified", "Value": "true"},
                  ],'''
          if old not in text:
              raise SystemExit('expected invite UserAttributes marker not found')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')

          test_path = Path('tests/test_dashboard_cognito_auth.py')
          tests = test_path.read_text(encoding='utf-8')
          marker = '    assert created[-1]["Username"] == "new@example.com"\n'
          addition = marker + '    assert {"Name": "email_verified", "Value": "true"} in created[-1]["UserAttributes"]\n'
          if marker not in tests:
              raise SystemExit('expected invite test marker not found')
          test_path.write_text(tests.replace(marker, addition, 1), encoding='utf-8')
          PY

      - name: Run full regression suite
        shell: bash
        run: |
          python3 -m pip install -r requirements.txt -r requirements-dashboard.txt
          python3 -m pytest tests/ -q

      - name: Commit verified-email fix
        shell: bash
        run: |
          git config user.name "HBlink4 automation"
          git config user.email "actions@users.noreply.github.com"
          git rm .github/workflows/fix-cognito-invite-email.yml
          git add dashboard/cognito_auth.py tests/test_dashboard_cognito_auth.py
          git commit -m "Verify Cognito admin invite email"
          git push origin HEAD:fix/cognito-invite-email-verification
