name: Add public dashboard version

on:
  push:
    branches:
      - feature/cognito-admins
    paths:
      - .github/workflows/add-dashboard-version.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/cognito-admins
          fetch-depth: 0

      - name: Add public dashboard version display
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('dashboard/static/dashboard.html')
          text = path.read_text()
          old = '''                    <div style="color: #64748b; font-size: 12px; margin-top: 4px;" id="serverName"></div>'''
          new = '''                    <div style="color: #64748b; font-size: 12px; margin-top: 4px;" id="serverName"></div>\n                    <div style="color: #64748b; font-size: 11px; margin-top: 2px;">Dashboard <span id="dashboardVersion">v1.2.0</span></div>'''
          if old not in text:
              raise SystemExit('public dashboard header marker not found')
          text = text.replace(old, new, 1)

          old_js = "document.getElementById('serverName').textContent = config.server_name || '';"
          new_js = old_js + "\n                document.getElementById('dashboardVersion').textContent = `v${config.dashboard_version || '1.2.0'}`;"
          if old_js not in text:
              raise SystemExit('dashboard config marker not found')
          text = text.replace(old_js, new_js, 1)
          path.write_text(text)

          test = Path('tests/test_dashboard_admin.py')
          text = test.read_text()
          needle = '    assert result["dashboard_title"] == "Test"\n'
          replacement = needle + '    assert result["dashboard_version"] == server.DASHBOARD_VERSION\n'
          if replacement not in text:
              if needle not in text:
                  raise SystemExit('dashboard config test marker not found')
              text = text.replace(needle, replacement, 1)
          test.write_text(text)
          PY
          grep -q 'id="dashboardVersion">v1.2.0' dashboard/static/dashboard.html

      - name: Run regression suite
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r requirements-dashboard.txt
          python -m pytest tests/ -v

      - name: Commit version display
        shell: bash
        run: |
          rm .github/workflows/add-dashboard-version.yml
          git config user.name "HBlink4 automation"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "Show semantic dashboard version"
          git push origin HEAD:feature/cognito-admins
